[project]
name = "smartflow"
version = "1.1.0"
description = "轻量级 AI Agent 框架：ReAct + HITL 人工审批 + 多会话 + RAG"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 仅开启错误级检查（import 排序等格式类问题交给 ruff format / pre-commit 处理，不阻塞 CI）
select = ["E", "F", "W"]
ignore = ["E501"]
